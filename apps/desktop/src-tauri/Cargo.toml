[package]
name = "woodward-tunnel-desktop"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Woodward Tunnel desktop app"
default-run = "woodward-tunnel"

# Standalone workspace: this crate is deliberately not part of the root workspace.
[workspace]

[lib]
name = "wt_desktop"
path = "src/lib.rs"

[[bin]]
name = "woodward-tunnel"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "=2.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
core-app = { path = "../../../crates/core-app" }
core-keyring = { path = "../../../crates/core-keyring" }
core-engine = { path = "../../../crates/core-engine" }
core-model = { path = "../../../crates/core-model" }
core-store = { path = "../../../crates/core-store" }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
core-engine = { path = "../../../crates/core-engine" }
core-log = { path = "../../../crates/core-log" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
