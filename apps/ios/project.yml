# XcodeGen spec. The .xcodeproj is generated, never hand-edited or committed:
#   xcodegen generate --spec project.yml
# Build prerequisites (Generated/ is produced by scripts/build-ios.sh):
#   Generated/Bindings/wtcore.swift + wtcoreFFI.h + module.modulemap   (UniFFI Swift bindings)
#   Generated/wtcore.xcframework                                       (Rust core, static)
#   Generated/Libbox.xcframework                                       (sing-box libbox via gomobile)
name: WoodwardTunnel

options:
  bundleIdPrefix: app.woodward
  developmentLanguage: fa
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    # Swift 5 language mode: the UniFFI-generated bindings and the gomobile ObjC callbacks are not
    # written for Swift 6 strict concurrency.
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Identifiers. Change these for your own team; they reach Info.plist and the entitlements.
    APP_BUNDLE_ID: app.woodward.tunnel
    TUNNEL_BUNDLE_ID: app.woodward.tunnel.PacketTunnel
    APP_GROUP_ID: group.app.woodward.tunnel
    KEYCHAIN_GROUP_SUFFIX: app.woodward.tunnel.shared
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_BITCODE: NO

targets:
  WoodwardTunnel:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - PrivacyInfo.xcprivacy
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared
      - path: Generated/Bindings/wtcore.swift
        optional: true
    dependencies:
      - target: PacketTunnel
        embed: true
      - framework: Generated/wtcore.xcframework
        embed: false
        link: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: WoodwardTunnel
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/WoodwardTunnel.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Generated/Bindings
        OTHER_LDFLAGS: "$(inherited) -lresolv"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
        excludes:
          - Info.plist
          - PrivacyInfo.xcprivacy
      - path: PacketTunnel/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Shared
    dependencies:
      - framework: Generated/Libbox.xcframework
        embed: false
        link: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TUNNEL_BUNDLE_ID)
        PRODUCT_NAME: PacketTunnel
        PRODUCT_MODULE_NAME: PacketTunnel
        INFOPLIST_FILE: PacketTunnel/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/PacketTunnel.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        OTHER_LDFLAGS: "$(inherited) -lresolv"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

schemes:
  WoodwardTunnel:
    build:
      targets:
        WoodwardTunnel: all
        PacketTunnel: all
    run:
      config: Debug
    archive:
      config: Release
