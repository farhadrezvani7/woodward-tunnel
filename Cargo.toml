[workspace]
resolver = "2"
members = ["crates/core-model", "crates/core-import", "crates/core-session", "crates/core-log", "crates/core-engine"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
percent-encoding = "2"
serde_yaml_ng = "0.10"
flate2 = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
