name: android
on:
  push:
    paths:
      - "apps/android/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/build-android.sh"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/build-android.sh"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358"

      # go.mod of sing-box asks for a newer Go than some runners ship; the toolchain is fetched on demand.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            target
          key: android-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: android-cargo-

      - name: Cache libbox build inputs
        uses: actions/cache@v4
        with:
          path: |
            apps/android/.cache
            apps/android/app/libs
            ~/.cache/go-build
            ~/go/pkg/mod
          # The pins live in the script; a change there invalidates the cache.
          key: android-libbox-${{ hashFiles('scripts/build-android.sh') }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Build (libbox, libwtcore for 4 ABIs, bindings, debug and release APKs)
        run: scripts/build-android.sh

      - uses: actions/upload-artifact@v4
        with:
          name: woodward-tunnel-android
          # Debug APK and a release APK signed with a throwaway CI keystore (not a real release key).
          path: apps/android/app/build/outputs/apk/*/*.apk
          if-no-files-found: error
