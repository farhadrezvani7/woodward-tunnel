name: android
on:
  push:
    paths:
      - "apps/android/**"
      - "crates/**"
      - "engines/awg-socks/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/build-android.sh"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - "crates/**"
      - "engines/awg-socks/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/build-android.sh"
      - ".github/workflows/android.yml"

# Least privilege: these workflows only read the repository and upload build artifacts.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358"

      # go.mod of sing-box asks for a newer Go than some runners ship; the toolchain is fetched on demand.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
          cache: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            target
          key: android-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: android-cargo-

      - name: Cache libbox build inputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            apps/android/.cache
            apps/android/app/libs
            ~/.cache/go-build
            ~/go/pkg/mod
          # The pins live in the script; a change there invalidates the cache.
          key: android-libbox-${{ hashFiles('scripts/build-android.sh') }}

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-home-cache-cleanup: true

      - name: Build (libbox, libwtcore for 4 ABIs, bindings, debug and release APKs)
        run: scripts/build-android.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: woodward-tunnel-android
          # Debug APK and a release APK signed with a throwaway CI keystore (not a real release key).
          path: apps/android/app/build/outputs/apk/*/*.apk
          if-no-files-found: error
