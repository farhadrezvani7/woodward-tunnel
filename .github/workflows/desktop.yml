name: desktop
on:
  push:
    paths: ["apps/desktop/**", "crates/**", "engines/**", "scripts/build-desktop.sh", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["apps/desktop/**", "crates/**", "engines/**", "scripts/build-desktop.sh", ".github/workflows/desktop.yml"]
  workflow_dispatch:

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - name: macos-x64
            os: macos-13
            target: x86_64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-go@v5
        with:
          go-version-file: engines/awg-socks/go.mod
          cache-dependency-path: engines/awg-socks/go.sum
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libdbus-1-dev libssl-dev patchelf libfuse2
      - name: Build bundle
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          WT_TAURI_ARGS: --bundles ${{ matrix.bundles }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # TODO(signing): set these repository secrets before publishing builds.
          # macOS: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          #        APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID (signing + notarization)
          # Windows: configure bundle.windows.signCommand or certificateThumbprint
        run: scripts/build-desktop.sh native
      - uses: actions/upload-artifact@v4
        with:
          name: woodward-tunnel-${{ matrix.name }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg

  e2e-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engines/awg-socks/go.mod
          cache-dependency-path: engines/awg-socks/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdbus-1-dev libssl-dev
      - name: Fetch engines and run the sing-box end-to-end test
        run: |
          scripts/build-desktop.sh engines x86_64-unknown-linux-gnu
          cd apps/desktop/src-tauri
          WT_SING_BOX="$PWD/binaries/wt-sing-box-x86_64-unknown-linux-gnu" cargo test --release
