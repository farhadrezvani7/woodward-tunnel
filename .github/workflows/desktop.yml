name: desktop
on:
  push:
    paths: ["apps/desktop/**", "crates/**", "engines/**", "scripts/build-desktop.sh", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["apps/desktop/**", "crates/**", "engines/**", "scripts/build-desktop.sh", ".github/workflows/desktop.yml"]
  workflow_dispatch:

# Least privilege: these workflows only read the repository and upload build artifacts.
permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - name: macos-x64
            os: macos-13
            target: x86_64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: engines/awg-socks/go.mod
          cache-dependency-path: engines/awg-socks/go.sum
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libdbus-1-dev libssl-dev patchelf libfuse2
      - name: Build bundle
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          WT_TAURI_ARGS: --bundles ${{ matrix.bundles }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # TODO(signing): set these repository secrets before publishing builds.
          # macOS: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          #        APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID (signing + notarization)
          # Windows: configure bundle.windows.signCommand or certificateThumbprint
        run: scripts/build-desktop.sh native
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: woodward-tunnel-${{ matrix.name }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg

  e2e-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: engines/awg-socks/go.mod
          cache-dependency-path: engines/awg-socks/go.sum
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - name: Linux system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdbus-1-dev libssl-dev
      - name: Fetch engines and run the sing-box end-to-end test
        run: |
          scripts/build-desktop.sh engines x86_64-unknown-linux-gnu
          cd apps/desktop/src-tauri
          WT_SING_BOX="$PWD/binaries/wt-sing-box-x86_64-unknown-linux-gnu" cargo test --release

  ui-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: UI tests (real UI code in jsdom, scripted backend)
        working-directory: apps/desktop
        run: |
          npm ci
          npm run test:ui
