name: ios

# Builds the iOS / iPadOS app. Nothing here signs or publishes: simulator build and an unsigned
# device archive only. UNVERIFIED: written without access to a Mac; the first run on GitHub is
# the first time any of the Xcode steps executes.
on:
  push:
    paths:
      - "apps/ios/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/build-ios.sh"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "apps/ios/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "scripts/build-ios.sh"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

env:
  SING_BOX_TAG: v1.14.3

jobs:
  # Pure-Swift logic (state machine, secret vault, handoff files, parsing) type-checks and its
  # tests run on Linux; every other Swift file is only syntax-checked here.
  logic:
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: apps/ios/scripts/typecheck-linux.sh
      - run: python3 apps/ios/scripts/check-strings.py

  app:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ios-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ios-cargo-

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Cache libbox build
        uses: actions/cache@v4
        with:
          path: |
            build/sing-box-${{ env.SING_BOX_TAG }}
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: ios-libbox-${{ env.SING_BOX_TAG }}-${{ hashFiles('scripts/build-ios.sh') }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Rust core and Swift bindings
        run: scripts/build-ios.sh rust

      - name: sing-box libbox
        run: scripts/build-ios.sh libbox
        env:
          GOTOOLCHAIN: auto

      - name: Generate Xcode project
        run: scripts/build-ios.sh project

      - name: Build for the simulator (unsigned)
        run: scripts/build-ios.sh simulator

      - name: Archive for devices (unsigned)
        run: scripts/build-ios.sh archive

      - name: Package the unsigned archive
        run: |
          cd apps/ios/build
          ditto -c -k --keepParent WoodwardTunnel.xcarchive WoodwardTunnel-unsigned.xcarchive.zip

      - uses: actions/upload-artifact@v4
        with:
          name: WoodwardTunnel-unsigned-xcarchive
          path: apps/ios/build/WoodwardTunnel-unsigned.xcarchive.zip
          if-no-files-found: error
          retention-days: 7
